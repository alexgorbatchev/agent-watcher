name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: Swatinem/rust-cache@v2
      - run: just build test

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: Install Rust components
        run: rustup component add rustfmt clippy llvm-tools --toolchain stable
      - uses: Swatinem/rust-cache@v2
      - name: Install coverage tool
        run: |
          if ! cargo llvm-cov --version | grep -Fx 'cargo-llvm-cov 0.9.1'; then
            cargo install --locked --version 0.9.1 cargo-llvm-cov
          fi
      - run: just lint coverage
